<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="auth.registerTitle">Create an account</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body data-page="register">
<a class="skip-link" href="#main" data-i18n="common.skipToContent">Skip to content</a>
<div id="site-header"></div>
<main id="main" class="container">
<div class="form-narrow card">
  <h1 data-i18n="auth.registerTitle">Create an account</h1>
  <div id="form-error"></div>
  <form id="register-form" novalidate>
    <div id="register-fields"></div>
    <button class="btn" type="submit" id="register-btn" data-i18n="nav.register">Register</button>
  </form>
  <p class="mt-4"><span data-i18n="auth.haveAccount">Already registered?</span> <a href="login.html" data-i18n="nav.login">Log in</a></p>
</div>
</main>
<div id="site-footer"></div>
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/geo.js"></script>
<script src="js/map.js"></script>
<script src="js/voice.js"></script>
<script src="js/components.js"></script>
<script src="js/icons.js"></script>
<script src="js/layout.js"></script>
<script src="js/pages/register.js"></script>
</body>
</html>
