<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="nav.findDoctor">Find Doctor</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body data-page="doctors">
<a class="skip-link" href="#main" data-i18n="common.skipToContent">Skip to content</a>
<div id="site-header"></div>
<main id="main" class="container">
<h1 data-i18n="nav.findDoctor">Find Doctor</h1>
<form id="search-form" class="card stack" novalidate>
  <div class="grid">
    <div id="name-field"></div>
    <div id="spec-field"></div>
  </div>
  <label class="check"><input type="checkbox" id="available-now"> <span data-i18n="doctor.availableOnly">Show only doctors available now</span></label>
  <label class="check"><input type="checkbox" id="use-location"> <span data-i18n="doctor.sortByDistance">Show the nearest doctors first (uses my location)</span></label>
  <div class="row"><span id="mic-slot"></span><button class="btn" type="submit" data-i18n="common.search">Search</button></div>
</form>
<div id="centre-filter"></div>
<div id="location-panel" class="hidden" style="margin-top:1rem"></div>
<div id="results" aria-live="polite" style="margin-top:1rem"></div>
</main>
<div id="site-footer"></div>
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/geo.js"></script>
<script src="js/map.js"></script>
<script src="js/voice.js"></script>
<script src="js/components.js"></script>
<script src="js/layout.js"></script>
<script src="js/pages/doctors.js"></script>
</body>
</html>
