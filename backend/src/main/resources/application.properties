spring.application.name=rural-health
server.port=${PORT:8080}

# ---- Database (all credentials come from environment variables) ----
spring.datasource.url=jdbc:h2:mem:rural_health;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# update = Hibernate creates/adjusts tables in development. Use "none" if you ran database/schema.sql yourself.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- Security ----
# JWT_SECRET is mandatory (min 32 characters). There is deliberately no default.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5500,http://127.0.0.1:5500}

# Optional: first admin account, created only if no ADMIN exists yet.
app.bootstrap-admin.email=${ADMIN_EMAIL:}
app.bootstrap-admin.password=${ADMIN_PASSWORD:}
app.bootstrap-admin.name=${ADMIN_NAME:Platform Admin}

# ---- Frontend served by Spring Boot during development (run from backend/) ----
spring.web.resources.static-locations=file:../frontend/,classpath:/static/

logging.level.com.ruralhealth=INFO

# ---- Search behaviour (Phase 2) ----
app.search.default-radius-km=${SEARCH_DEFAULT_RADIUS_KM:10}
app.search.max-radius-km=${SEARCH_MAX_RADIUS_KM:50}
app.search.stale-after-days=${STALE_AFTER_DAYS:7}
app.search.low-stock-threshold=${LOW_STOCK_THRESHOLD:10}

# ---- Caching ----
# simple = in-memory (works without Redis). Set CACHE_TYPE=redis once Redis is running.
# A Redis password, if any, can be given as SPRING_DATA_REDIS_PASSWORD.
spring.cache.type=${CACHE_TYPE:simple}
spring.cache.cache-names=medicineSuggestions
spring.cache.redis.time-to-live=10m
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms
spring.data.redis.repositories.enabled=false

# ---- Optional sample data (only used with the "sample" profile) ----
app.sample-data.password=${SAMPLE_DATA_PASSWORD:}
app.timezone=${APP_TIMEZONE:Asia/Kolkata}
